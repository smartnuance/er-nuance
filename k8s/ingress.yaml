apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: er-nuance
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - er.smartnuance.com
      secretName: er-nuance-tls
  rules:
    - host: er.smartnuance.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: er-nuance
                port:
                  number: 80
