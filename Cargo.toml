[package]
name = "er-nuance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Navigate and diff large Mermaid ER diagrams, on the desktop or in the browser"
license = "MIT"
authors = ["Simon Wehrli"]
repository = "https://github.com/smartnuance/er-nuance"
homepage = "https://github.com/smartnuance/er-nuance"
readme = "README.md"
keywords = ["mermaid", "erd", "diagram", "database", "diff"]
categories = ["visualization", "development-tools", "database"]
exclude = ["docs/superpowers/"]

[[bin]]
name = "ernuance"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89.0", default-features = false, features = ["revision", "index", "sha1"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "console"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"

[profile.dev]
opt-level = 1

# Size-optimised build for the browser (trunk: data-cargo-profile="web-release")
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
